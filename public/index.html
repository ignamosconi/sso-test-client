<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SSO Test</title>

  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <main class="container">

    <h1>SSO Test Client</h1>

    <p>
      Aplicación de prueba para validar el SSO de UTN FRVM.
    </p>

    <section class="card">

      <button id="loginButton">
        Iniciar sesión con SSO
      </button>

      <button id="sessionButton">
        Consultar sesión
      </button>

      <button id="refreshButton">
        Probar refresh token
      </button>

      <button id="logoutButton">
        Cerrar sesión
      </button>

    </section>

    <section class="card">

      <h2>Resultado</h2>

      <pre id="result">
Todavía no se ejecutó ninguna operación.
      </pre>

    </section>

    <section id="success" class="success hidden">

      <h2>✅ Éxito de SSO</h2>

      <p>
        El alumno fue autenticado correctamente.
      </p>

      <pre id="userData"></pre>

    </section>

  </main>

  <script src="/app.js"></script>
</body>
</html>
